<div class="d-flex gap-2">
  <input id="busca" class="form-control mb-2" placeholder="Pesquisar setor">
  <input id="busca2" class="form-control mb-2" placeholder="Pesquisar quadra">
</div>

<div class="d-flex gap-2 flex-grow-1">
  <select id="setores" class="form-select h-100" multiple></select>
  <select id="quadras" class="form-select h-100" multiple></select>
</div>

<div class="mt-2 d-flex gap-2 align-items-center">
  <input id="change" class="form-control" style="width: calc(50% - 0.25rem)" hidden>
  <div class="d-flex gap-2 ms-auto">
    <button id="add-btn" class="btn btn-primary">Adicionar</button>
    <button id="edit-btn" class="btn btn-secondary">Editar</button>
    <button id="del-btn" class="btn btn-danger">Apagar</button>
  </div>
</div>
