<style>

  .dropdown-menu {
    width: calc(100% + 2px) !important;
    margin-left: -1px !important;
    min-width: 0;
  }

  .input-group .dropdown-menu{
    width: auto !important;
    margin-left: 0 !important;
  }

  .bi-underline {
    display: inline-block;
    border-bottom: 1.5px solid currentColor;
    padding-bottom: 0;
    line-height: 1;
    font-size: 1.4rem;
  }

  .btn-outline-secondary{
    --bs-btn-border-color: #ced4da;
  }
  
  button .bi{
    margin-right: unset !important;
  }

</style>

<div class="d-flex flex-column gap-4 m-3 mt-2">

  <!-- HEADER -->
  <div class="d-flex align-items-center border-bottom pb-1 mb-2">
    <i class="bi bi-pencil-fill text-primary bi-underline"></i>
    <h2 style="position: relative; top: 3px">Criar Evento</h2>
  </div>
  
  <!-- TÍTULO -->
  <div class="d-flex col-7">    
    <input id="titulo" class="form-control" placeholder="Título">
  </div>

  <!-- DATA E TIPO-->
  <div class="d-flex gap-1 col-7">    
    <div class="col">
      <div class="row g-2">

        <!-- tipo -->
        <div class="col-4">
          <div class="dropdown w-100">
            <button id="tipo-btn" class="btn btn-outline-secondary w-100 text-start dropdown-toggle" data-bs-toggle="dropdown">
              Tipo
            </button>
            <ul id="tipo" class="dropdown-menu py-1" style="width: calc(100% + 2px)"></ul>
          </div>
        </div>

        <!-- datas -->
        <div class="col-8">
          <div class="input-group dropdown">
            <button id="inicio" class="btn btn-outline-secondary dropdown-toggle flex-grow-1 text-start" style="width: 0" data-bs-toggle="dropdown" data-bs-auto-close="outside" data-bs-offset="-75%,0">Início</button >
            <div class="dropdown-menu shadow-sm p-0">
              <div id="calendario-inicio"></div>
            </div>
            <button id="rev-btn" class="btn btn-light btn-outline-secondary">
              <i class="bi bi-arrow-left-right flex-grow-0"></i>
            </button>
            <button id="fim" class="btn btn-outline-secondary dropdown-toggle flex-grow-1 text-start" style="width: 0" data-bs-toggle="dropdown" data-bs-auto-close="outside" data-bs-offset="-75%,0">Fim</button>
            <div class="dropdown-menu shadow-sm p-0">
              <div id="calendario-fim"></div>
            </div>
            <button id="add-btn" class="btn btn-light btn-outline-secondary">
              <i class="bi bi-plus-lg flex-grow-0"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- datas selecionadas -->
      <div id="datasSelecionadas" class="d-flex flex-wrap gap-1"></div>

    </div>
  </div>

  <!-- LOCAIS -->
  <div class="d-flex gap-1 col-7">  
    <div class="col">

      <div class="dropdown w-100">
        <button class="btn btn-outline-secondary w-100 text-start dropdown-toggle" data-bs-toggle="dropdown" data-bs-auto-close="outside">
          Selecionar locais
        </button>
        <div class="dropdown-menu px-2 shadow-sm w-100">

          <!-- busca -->
          <input id="busca-locais" class="form-control mb-2" placeholder="Buscar setor ou quadra">
          
          <!-- lista dinâmica -->
          <div id="lista-locais" style="overflow:auto; max-height: 220px"></div>
        </div>
      </div>

      <!-- selecionados (cresce verticalmente) -->
      <div id="locaisSelecionados" class="d-flex flex-wrap gap-1"></div>

    </div>
  </div>

  <!-- DESCRIÇÃO -->
  <div class="d-flex gap-1 col-7">
    <div class="col">
      <textarea id="obs" class="form-control" placeholder="Descrição" rows="5"></textarea>
    </div>
  </div>

  <!-- AÇÕES -->
  <div class="d-flex justify-content-end gap-2 col-7">
    <button id="btn-add" class="btn btn-outline-secondary rounded" type="submit">Adicionar</button>
  </div>
</div>
