<style>

  .ql-toolbar{
    border-top: none !important;
    border-left: none !important;
    border-right: none !important;
  }
  .ql-container {
    border: none !important;
    overflow: hidden !important
  }

  .ql-editor {
    min-height: calc(5 * 1.5em);
    max-height: calc(7 * 1.5em);
    line-height: 1.5;
    overflow: auto !important
  }

</style>

<div class="d-flex gap-3 flex-grow-1" style="min-height: 0">
  <div class="col-6 d-flex flex-column gap-4" id="add-container">
    
    <!-- TÍTULO -->   
    <input id="titulo" class="form-control" placeholder="Título">

    <!-- DATA E TIPO-->
    <div class="row g-2">

      <!-- tipo -->
      <div class="col-4">
        <div class="dropdown w-100">
          <button id="tipo-btn" class="btn btn-outline-secondary w-100 text-start dropdown-toggle" data-bs-toggle="dropdown">
            Tipo
          </button>
          <ul id="tipo" class="dropdown-menu py-1"></ul>
        </div>
      </div>

      <!-- datas -->
      <div class="col-8">
        <div class="input-group dropdown">
          <button id="inicio" class="btn btn-outline-secondary dropdown-toggle flex-grow-1 text-start border-end-0" style="width: 0" data-bs-toggle="dropdown" data-bs-auto-close="outside" data-bs-offset="-75%,0">Início</button >
          <div class="dropdown-menu shadow-sm p-0">
            <div id="calendario-inicio"></div>
          </div>
          <button id="rev-btn" class="btn btn-light btn-outline-secondary">
            <i class="bi bi-arrow-left-right flex-grow-0"></i>
          </button>
          <button id="fim" class="btn btn-outline-secondary dropdown-toggle flex-grow-1 text-start  border-start-0 border-end-0" style="width: 0" data-bs-toggle="dropdown" data-bs-auto-close="outside" data-bs-offset="-75%,0">Fim</button>
          <div class="dropdown-menu shadow-sm p-0">
            <div id="calendario-fim"></div>
          </div>
          <button id="add-btn" class="btn btn-light btn-outline-secondary">
            <i class="bi bi-plus-lg flex-grow-0"></i>
          </button>
        </div>
      </div>

    </div>

    <!-- LOCAIS -->
    <div class="d-flex">  
      <div class="col">

        <div class="dropdown w-100">
          <button class="btn btn-outline-secondary w-100 text-start dropdown-toggle" data-bs-toggle="dropdown" data-bs-auto-close="outside">
            Selecionar locais
          </button>
          <div class="dropdown-menu px-2 shadow-sm w-100">

            <!-- busca -->
            <input id="busca-locais" class="form-control mb-2" placeholder="Buscar setor ou quadra">
            
            <!-- lista dinâmica -->
            <div id="lista-locais" style="overflow:auto; max-height: 220px"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- DESCRIÇÃO -->
    <div class="border rounded overflow-hidden">
      <div id="obs"></div>
    </div>

    <!-- AÇÕES -->
    <div id="submit" class="d-flex gap-2 justify-content-end">
      <button id="submit-btn" class="btn btn-outline-secondary rounded" type="submit">Adicionar</button>
    </div>
  </div>

  <div class="col p-3 d-flex flex-column flex-grow-1 border border-2 rounded mb-4 overflow-clip shadow-sm" style="min-height: 0" id="preview"></div>
</div>
