<div class="d-flex gap-2 mb-2">
  <input id="busca" class="form-control" placeholder="Pesquisar evento">
  <input id="periodo" class="form-control" placeholder="Período" disabled>
</div>

<div class="d-flex gap-2 flex-grow-1">
  <select id="eventos" class="form-select h-100" multiple></select>
  <select id="config" class="form-select h-100" multiple></select>
</div>

<div class="mt-2 d-flex align-items-center">
  <div class="form-check form-switch">
    <input class="form-check-input" type="checkbox" id="criados">
    <label class="form-check-label text-nowrap" for="criados">Meus eventos</label>
  </div>
  <div class="d-flex gap-2 ms-auto">
    <button id="add-btn" class="btn btn-primary">Adicionar</button>
    <button id="edit-btn" class="btn btn-secondary">Editar</button>
    <button id="del-btn" class="btn btn-danger">Apagar</button>
  </div>
</div>
