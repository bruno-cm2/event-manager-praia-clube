<div class="h-100 d-flex flex-column">

  <!-- HEADER -->
  <div class="header d-flex align-items-center border-bottom pb-1 mb-4">
    <i class="bi bi-calendar2-event-fill text-success" style="font-size: 1.6rem"></i>
    <h2 style="left: -0.2rem">Lista de Eventos</h2>
  </div>

  <div class="d-flex gap-2 mb-2">
    <input id="busca" class="form-control" placeholder="Pesquisar evento">
    <input id="periodo" class="form-control" placeholder="Período">
  </div>

  <div class="d-flex gap-2 flex-grow-1">
    <select id="eventos" class="form-select" size="10"></select>
    <select id="config" class="form-select" size="10"></select>
  </div>

  <div class="mt-2 d-flex gap-2 justify-content-end">
    <button id="add-btn" class="btn btn-primary">Adicionar</button>
    <button id="edit-btn" class="btn btn-secondary">Editar</button>
    <button id="del-btn" class="btn btn-danger">Apagar</button>
  </div>
  
</div>
