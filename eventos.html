<div class="row g-2 mb-2">
  <div class="col-6">
    <input id="busca" class="form-control" placeholder="Pesquisar evento">
  </div>
  <div class="col">
    <div class="dropdown">
      <button id="periodo" class="btn btn-outline-secondary text-start dropdown-toggle w-100" data-bs-toggle="dropdown" data-bs-auto-close="outside" data-bs-display="static">Período</button>
      <div class="dropdown-menu shadow-sm p-0" style="left: 50%; transform: translateX(-50%)">
        <div id="calendario-periodo"></div>
      </div>
    </div>
  </div>
</div>

<div class="d-flex gap-2 flex-grow-1" style="height: 0">
  <div class="lista col-6 border rounded" id="eventos"></div>
  <div class="lista col border rounded d-flex flex-column" style="min-height: 0">
    <div class="p-3 d-flex flex-column flex-grow-1" style="min-height: 0" id="config"></div>
  </div>
  <!-- <select id="eventos" class="form-select h-100" multiple></select>
  <select id="config" class="form-select h-100" multiple></select> -->
</div>

<div class="d-flex mt-2 align-items-center">
  <div class="d-flex flex-wrap gap-2 align-items-baseline">
    <label>Mostrar:</label>
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="futuros" checked>
      <label class="form-check-label" for="futuros">Futuros</label>
    </div>
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="em-andamento" checked>
      <label class="form-check-label" for="em-andamento">Em andamento</label>
    </div>
    <div class="form-check form-switch me-1">
      <input class="form-check-input" type="checkbox" id="finalizados">
      <label class="form-check-label" for="finalizados">Finalizados</label>
    </div>
    <label class="border-start ps-3">Filtro:</label>
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="criados">
      <label class="form-check-label" for="criados">Meus eventos</label>
    </div>
  </div>
  <div class="d-flex ms-auto gap-2">
    <button id="add-btn" class="btn btn-primary">Adicionar</button>
    <button id="edit-btn" class="btn btn-secondary">Editar</button>
    <button id="del-btn" class="btn btn-danger">Apagar</button>
  </div>
</div>
