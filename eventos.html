<div class="h-100 d-flex flex-column">

  <div class="d-flex gap-2 mb-2">
    <input id="busca" class="form-control" placeholder="Pesquisar evento">
    <input id="periodo" class="form-control" placeholder="Período">
  </div>

  <div class="d-flex gap-2 flex-grow-1">
    <select id="eventos" class="form-select" size="10"></select>
    <select id="config" class="form-select" size="10"></select>
  </div>

  <div class="mt-2 d-flex gap-2 justify-content-end">
    <button id="add" class="btn btn-primary">Adicionar</button>
    <button id="edit" class="btn btn-secondary">Editar</button>
    <button id="del" class="btn btn-danger">Apagar</button>
  </div>

  <div id="msg" class="small text-muted mt-2"></div>

</div>
