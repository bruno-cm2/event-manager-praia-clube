<div class="col">

  <!-- HEADER -->
  <div class="header d-flex align-items-center border-bottom pb-1  mb-4">
    <i class="bi bi-person-circle text-dark" style="font-size: 1.6rem"></i>
    <h2 style="left: -0.2rem">Conta</h2>
  </div>

  <div class="col-6 d-flex flex-column gap-4">

    <!-- NOME -->
    <div class="row g-2">
      <div class="col">
        <input type="text" class="form-control" id="nome" placeholder="Nome">
      </div>
      <div class="col">
        <input type="text" class="form-control" id="sobrenome" placeholder="Sobrenome">
      </div>
    </div>

    <!-- SETOR -->
    <input type="text" class="form-control" id="setor" placeholder="Setor">

    <!-- EMAIL -->
    <div class="input-group">
      <input type="text" class="form-control" id="email" placeholder="Email">
      <span class="input-group-text">@praiaclube.org.br</span>
    </div>

    <!-- SENHA -->

    <template id="pass-tpl">
      <div class="row g-2">
        <div class="col">
          <input type="password" class="form-control" id="pass" placeholder="Senha" disabled>
        </div>
        <div class="col-auto">
          <button id="change-btn" class="btn btn-light btn-outline-secondary">Alterar senha</button>
        </div>
      </div>
    </template>

    <template id="change-tpl">
      <div class="col g-2">
        <div class="pass-input input-group">
          <input type="password" class="form-control" id="old-pass" placeholder="Senha antiga">
          <button class="btn btn-light btn-outline-secondary">
            <i class="bi bi-eye-fill"></i>
          </button>
        </div>
        <div class="pass-input input-group">
          <input type="password" class="form-control" id="new-pass" placeholder="Nova senha">
          <button class="btn btn-light btn-outline-secondary" hidden>
            <i class="bi bi-eye-fill"></i>
          </button>
        </div>
        <div class="d-flex gap-2 justify-content-end">
          <button id="save-btn" class="btn btn-light btn-outline-secondary">Salvar</button>
          <button id="cancel-btn" class="btn btn-light btn-outline-secondary">Cancelar</button>
        </div>
      </div>
    </template>
    
    <div id="pass-slot"></div>

  </div>
</div>
