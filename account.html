<div class="col-7 d-flex flex-column gap-4">

  <!-- NOME -->
  <div class="row g-2">
    <div class="col">
      <input type="text" class="form-control" id="nome" placeholder="Nome" disabled>
    </div>
    <div class="col">
      <input type="text" class="form-control" id="sobrenome" placeholder="Sobrenome" disabled>
    </div>
  </div>

  <!-- SETOR -->
  <input type="text" class="form-control" id="setor" placeholder="Setor" disabled>

  <!-- EMAIL -->
  <div class="input-group">
    <input type="text" class="form-control" id="email" placeholder="Email" disabled>
    <span class="input-group-text">@praiaclube.org.br</span>
  </div>

  <!-- SENHA -->

  <div class="row g-2" id="panel-main">
    <div class="col">
      <input type="password" class="form-control" id="senha" placeholder="Senha" disabled>
    </div>
    <div class="col-auto">
      <button id="change-btn" class="btn btn-light btn-outline-secondary">Alterar senha</button>
    </div>
  </div>

  <div class="d-flex flex-column gap-4 d-none" id="panel-change">
    <div class="pass-input input-group">
      <input type="password" class="form-control" id="old-pass" placeholder="Senha antiga">
      <button class="btn btn-light btn-outline-secondary">
        <i class="bi bi-eye-fill"></i>
      </button>
    </div>
    <div class="pass-input input-group">
      <input type="password" class="form-control" id="new-pass" placeholder="Nova senha">
      <button class="btn btn-light btn-outline-secondary">
        <i class="bi bi-eye-fill"></i>
      </button>
    </div>
    <div class="d-flex gap-2 justify-content-end">
      <button id="save-btn" class="btn btn-light btn-outline-secondary">Salvar</button>
      <button id="cancel-btn" class="btn btn-light btn-outline-secondary">Cancelar</button>
    </div>
  </div>
</div>
