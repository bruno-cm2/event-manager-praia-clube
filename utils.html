<script>

  function clamp(value, min, max) {
    value = Number(value)
    if (Number.isNaN(value)) return ''
    return Math.min(Math.max(value, min), max)
  }

  function disable(obj){
    if(Array.isArray(obj)) obj.forEach(disable)
    else obj.disabled = true
  }

  function enable(obj){
    if(Array.isArray(obj)) obj.forEach(enable)
    else obj.disabled = false
  }

  function toggle(obj, boolean){
    if(Array.isArray(obj)) obj.forEach(o => toggle(o, boolean))
    else obj.disabled = !boolean
  }

  function capital(str){
    str = String(str)
    return str.charAt(0).toUpperCase() + str.slice(1)
  }

  function isInside(x,y,folga = 0){
    folga *= 60 * 1000
    const depois = y.inicio ? new Date(y.inicio).getTime() < (new Date(x.fim).getTime() - folga + 1000) : true
    const antes = y.fim ? new Date(x.inicio).getTime() < (new Date(y.fim).getTime() + folga - 1000) : true
    return antes && depois
  }


  Date.prototype.hora = function(){
    return this.toLocaleTimeString('pt-BR', {
      hour: '2-digit',
      minute: '2-digit'
    })
  }

  Date.prototype.data = function(){
    return this.toLocaleDateString('pt-BR', {
      month: 'numeric',
      day: 'numeric'
    })
  }

  Date.prototype.datahora = function(termo = 'às'){
    const data = this.toLocaleDateString('pt-BR', {
      month: 'numeric',
      day: 'numeric',
    })

    const hora = this.toLocaleTimeString('pt-BR', {
      hour: '2-digit',
      minute: '2-digit'
    })

    return `${data} ${termo} ${hora}`
  }

</script>
