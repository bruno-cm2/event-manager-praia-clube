<html>
  <head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litepicker/dist/css/litepicker.css">

        background-color: var(--bs-light);

    </style>

  </head>
  <body class="container-fluid">

    <template id="view-eventos">
      <?!= HtmlService.createHtmlOutputFromFile('eventos').getContent() ?>
    </template>

    <template id="view-add">
      <?!= HtmlService.createHtmlOutputFromFile('add').getContent() ?>
    </template>

    <div class="row h-100">
      <aside class="col-2 shadow p-0">
        <ul class="nav nav-pills d-flex flex-column h-100">
          <img src="https://x1futsal.com.br/wp-content/uploads/2021/04/Escudo-Completo-Praia-Clube.png" class="img-fluid w-50 m-3 mb-4">
          <li class="nav-item p-0">
            <a class="nav-link w-100 text-start text-dark" href="#inicio">
              <i class="bi bi-house text-warning"></i>Início
            </a>
          </li>
          <li class="nav-item p-0">
            <a class="nav-link w-100 text-start text-dark" href="#add">
              <i class="bi bi-pencil-square text-primary"></i>Criar
            </a>
          </li>
          <li class="nav-item p-0">
            <a class="nav-link w-100 text-start text-dark" href="#eventos">
              <i class="bi bi-calendar text-success"></i>Eventos
            </a>
          </li>
          <li class="nav-item p-0 mt-auto mb-3">
            <a class="nav-link w-100 text-start text-dark" href="#conta">
              <i class="bi bi-person-circle text-dark"></i>Conta
            </a>
          </li>
        </ul>
      </aside>
      <main class="col py-2 d-flex flex-column border rounded-3 shadow-sm bg-white m-3" id="content"></main>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div id="toast" class="toast" role="alert">
        <div class="d-flex">
          <div class="toast-body">
          </div>
        </div>
      </div>
    </div>

    <?!= HtmlService.createHtmlOutputFromFile('utils').getContent() ?>
    
    <script>

      const EV = <?!= JSON.stringify(ev) ?>;
      const LC = <?!= JSON.stringify(lc) ?>;

      const CACHE = <?!= cache ?>;

      const TIPOS = <?!= JSON.stringify(tipos) ?>;

      //
      // NAVEGAÇÃO
      //

      const content = document.getElementById('content')
      const cache = {}

      const sidebarLinks = document.querySelectorAll('.nav-link')

      window.addEventListener('hashchange', () => {go(location.hash.slice(1))})

      function go(page) {
        const tpl = document.getElementById(`view-${page}`)
        if (!tpl) return

        sidebarLinks.forEach(a => {
          a.classList.toggle('active', a.getAttribute('href') === `#${page}`)
        })

        content.innerHTML = ''
        content.appendChild(tpl.content.cloneNode(true))

        if (page === 'eventos') {
          EventosView.init(EV)
        }

        if (page === 'add') {
          try { AddView.init(LC, CACHE) } catch(e) { toast(e.message + e.stack) }
        }
      }

      //
      // CONTROLE
      //

      const textMsg = document.getElementById("toast")
      const msg = new bootstrap.Toast(textMsg, {delay: 3000})

      function toast(text, cor = 'light') {
        textMsg.classList = `toast align-items-center border-0 text-bg-${cor}`
        textMsg.querySelector('.toast-body').textContent = text
        msg.show()
      }
      
      const EventosView = {
        cache() {
          this.busca   = document.getElementById('busca')
          this.inicio  = document.getElementById('inicio')
          this.fim     = document.getElementById('fim')
          this.lista   = document.getElementById('eventos')
          this.config  = document.getElementById('config')
          this.periodo = document.getElementById('periodo')

          this.addBtn  = document.getElementById('add')
          this.editBtn = document.getElementById('edit')
          this.delBtn  = document.getElementById('del')
          this.msg     = document.getElementById('msg')
        },

        bind() {
          this.busca.oninput = () => this.filtrar()

          this.lista.onchange = () => this.renderConfig()

          this.addBtn.onclick  = () => this.adicionar()
          this.editBtn.onclick = () => this.editar()
          this.delBtn.onclick  = () => this.apagar()
        },

        init(db) {
          this.db = db
          this.eventos = Array.isArray(db.eventos) ? db.eventos.slice() : []
          this.cache()
          this.bind()
          this.renderLista()
          flatpickr(this.periodo, {
            mode: "range",
            dateFormat: "Y-m-d",
            locale: "pt",
            allowInput: true,
            onChange: () => this.filtrar()
          })
        },

        renderLista(arr = this.eventos) {
          this.lista.innerHTML = ''

          if (!arr.length) {
            this.lista.innerHTML = `<option disabled>Nenhum evento</option>`
            return
          }

          arr.forEach(e => {
            const opt = document.createElement('option')
            opt.value = e.id
            opt.textContent = e.titulo
            this.lista.appendChild(opt)
          })

          this.lista.selectedIndex = 0
          this.renderConfig()
        },

        renderConfig() {
          const id = this.lista.value
          const ev = this.db.eventos.find(e => e.id == id)

          this.config.innerHTML = ''
          if (!ev) return

          const ordem = ['titulo', 'locais', 'inicio', 'fim', 'tipo', 'id', 'serverID']

          Object.entries(ev).sort((a, b) => ordem.indexOf(a[0]) - ordem.indexOf(b[0])).forEach(([k, v]) => {
            if (k === 'obs' || k === 'titulo') return
            const opt = document.createElement('option')
            opt.textContent = `${capital(k)}: ${Array.isArray(v) ? v.length : v}`
            this.config.appendChild(opt)
          })
        },

        filtrar() {
          const termo = this.busca.value.toLowerCase()
          const filtrados = this.eventos.filter(e =>
            e.titulo.toLowerCase().includes(termo) ||
            String(e.id).includes(termo)
          )
          this.renderLista(filtrados)
        },

        adicionar() {
          google.script.run.criarEvento(true)
        },

        editar() {
          const ev = this.getSelecionado()
          if (!ev) return
          google.script.run._atualizarEvento(ev)
        },

        apagar() {
          const ev = this.getSelecionado()
          if (!ev) return
          if (!confirm(`Apagar ${ev.titulo}?`)) return

          google.script.run
            .withSuccessHandler(() => {
              this.db.eventos = this.db.eventos.filter(e => e.id != ev.id)
              this.eventos = this.db.eventos.slice()
              this.renderLista()
            })
            ._deleteEvento(ev.id)
        },

        getSelecionado() {
          return this.db.eventos.find(e => e.id == this.lista.value)
        }
      }

      const AddView = {
        init(db, cache) {
          this.db = db
          this.CACHE = cache
          this.locaisSel = []

          this.getDOM()
          this.bind()
          this.renderListaLocais()
          this.renderCalendar()
          this.renderTipos()
          this.titulo.focus()
        },

        getDOM() {
          this.titulo = document.getElementById('titulo')
          this.periodo = document.getElementById('periodo')
          this.tipoBtn = document.getElementById('tipo-btn')
          this.datasBtn = document.getElementById('datas-btn')
          this.tipo = document.getElementById('tipo')
          this.buscaLocais = document.getElementById('busca-locais')
          this.listaLocais = document.getElementById('lista-locais')
          this.locaisSelecionados = document.getElementById('locaisSelecionados')
          this.addBtn = document.getElementById('add-btn')
          this.datasSelecionadas = document.getElementById('datasSelecionadas')
          this.inicio = document.getElementById('inicio')
          this.fim = document.getElementById('fim')
        },

        bind() {
          this.buscaLocais.oninput = () => this.renderListaLocais(this.buscaLocais.value)
          this.addBtn.onclick = () => this.renderDatas()
        },

        renderListaLocais(filtro = '') {
          this.listaLocais.innerHTML = ''
          const termo = filtro

          const setores = this.db.setores.filter(s => s.ativo).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'))

          setores.forEach(setor => {
            if (!setor.nome.toLowerCase().includes(termo.toLowerCase()) &&
                !setor.quadras.some(q => q.ativo && q.nome.toLowerCase().includes(termo.toLowerCase()))) return

            // setor
            const header = document.createElement('div')
            header.className = 'dropdown-item rounded fw-bold ps-2 sticky-top dropdown-header-sticky'
            header.textContent = setor.nome
            header.id = setor.id
            header.onclick = () => this.selecionarLocal(setor)
            this.listaLocais.appendChild(header)

            // quadras
            setor.quadras.filter(q => q.ativo && q.nome.toLowerCase().includes(termo)).sort((a, b) => Number(a.nome) - Number(b.nome) || a.nome.localeCompare(b.nome, 'pt-BR')).forEach(q => {
              const item = document.createElement('div')
              item.className = 'dropdown-item rounded p-0 ps-3'
              item.id = q.id
              item.textContent = q.nome
              item.onclick = () => this.selecionarLocal(q)
              this.listaLocais.appendChild(item)
            })
          })
        },

        renderSelecionados() {
          this.locaisSelecionados.innerHTML = ''
          this.locaisSel.sort((a, b) => {
            const pa = a.tipo == 'setor' ? 0 : 1
            const pb = b.tipo == 'setor' ? 0 : 1

            return (pa - pb || Number(a.nome) - Number(b.nome) ||  a.nome.localeCompare(b.nome, 'pt-BR'))
          }).forEach(l => {
            const btn = document.createElement('button')
            btn.className = 'btn btn-sm align-items-center rounded-2 gap-1 mt-1'
            btn.textContent = l.tipo == 'quadra' ? `${l.setor}: ${l.nome}` : l.nome
            btn.classList.add('btn-' + (l.tipo == 'setor' ? 'primary' : 'success'))
            btn.onclick = () => this.apagarLocal(l)
            this.locaisSelecionados.appendChild(btn)
          })
        },

        selecionarLocal(local) {
          this.listaLocais.querySelectorAll(`[id^="${local.id + '.'}"]`).forEach(l => l.classList.add('disabled'))
          this.listaLocais.querySelector(`[id="${local.id}"]`).classList.add('disabled')

          this.locaisSel = [local, ...this.locaisSel.filter(l => !l.id.startsWith(local.id + '.'))]
          this.renderSelecionados()
        },

        apagarLocal(local){
          this.listaLocais.querySelectorAll(`[id^="${local.id + '.'}"]`).forEach(l => l.classList.remove('disabled'))
          this.listaLocais.querySelector(`[id="${local.id}"]`).classList.remove('disabled')

          this.locaisSel = this.locaisSel.filter(l => l.id != local.id)
          this.renderSelecionados()
        },

        renderCalendar() {

          flatpickr("#calendario-inicio", {
            locale: "pt",
            inline: true,
            enableTime: true,
            time_24hr: true,
            dateFormat: "d/m \\à\\s H:i",
            onChange: (selectedDates, dateStr) => {
              inicio.textContent = dateStr
              inicio.color = 'black'
              inicio.dataset.date = selectedDates[0]
            }
          })

          flatpickr("#calendario-fim", {
            locale: "pt",
            inline: true,
            enableTime: true,
            time_24hr: true,
            dateFormat: "d/m \\à\\s H:i",
            onChange: (selectedDates, dateStr) => {
              fim.textContent = dateStr
              fim.color = 'black'
              fim.dataset.date = selectedDates[0]
            }
          })
        },

        renderDatas() {
          if(!inicio.dataset.date) return toast('Selecione uma data de início', 'danger')
          if(!fim.dataset.date) return toast('Selecione uma data de fim', 'danger')
  
          const date = {inicio: new Date(inicio.dataset.date), fim: new Date(fim.dataset.date)}
          const intervalo = date.fim - date.inicio

          const datas = [...datasSelecionadas.querySelectorAll('button')].map(d => JSON.parse(d.dataset.date))
          
          if(Math.abs(intervalo) < 60 * 60 * 1000) return toast('Escolha um intervalo de pelo menos 1 hora', 'danger')
          if(date.inicio > date.fim) {
            toast('Data de início maior que fim, invertendo...', 'warning');
            [inicio.textContent, fim.textContent] = [fim.textContent, inicio.textContent];
            [date.inicio, date.fim] = [date.fim, date.inicio]
          }

          const folga = 30

          if(datas.some(d => this.isInside(date, d))) return toast('Essa data já foi escolhida', 'danger')
          if(datas.some(d => this.isInside(date, d, folga))) return toast(`No mínimo ${folga} minutos de folga entre datas`, 'danger')

          const longo = intervalo >= 24 * 60 * 60 * 1000
          const shortFormat = inicio.textContent + ' até ' + fim.textContent.split(' às ')[1]
          const longFormat = inicio.textContent + ' até ' + fim.textContent

          const btn = document.createElement('button')
          btn.className = 'btn btn-sm align-items-center rounded-2 gap-1 mt-1'
          btn.textContent = longo ? longFormat : shortFormat
          this.resetDates()
          btn.dataset.date = JSON.stringify(date)
          btn.classList.add('btn-' + (longo ? 'primary' : 'success'))
          btn.onclick = () => btn.remove()
          this.datasSelecionadas.appendChild(btn)
        },

        resetDates(){
          inicio.textContent = 'Início'
          fim.textContent = 'Fim'
          delete inicio.dataset.date
          delete fim.dataset.date
        },

        renderTipos() {
          this.tipoSelecionado = null
          this.tipoBtn.textContent = 'Tipo'

          this.tipo.innerHTML = ''

          Object.entries(TIPOS).forEach(([nome,cor]) =>{

            const li = document.createElement('li')
            li.classList.add('px-1')

            const a = document.createElement('li')
            a.className = "dropdown-item rounded ps-2"
            a.textContent = nome
            a.style.cssText = `--bs-dropdown-link-active-bg: var(--bs-${cor}); --bs-dropdown-link-active-color: white;`
            a.onclick = (e) => {
              e.preventDefault()
              this.tipoSelecionado = a.textContent
              this.tipoBtn.textContent = a.textContent
              this.tipoBtn.classList.remove('is-invalid')

              Array.from(this.tipoBtn.classList).forEach(c => {
                if (c.startsWith('btn-')) this.tipoBtn.classList.remove(c)
              })

              this.tipoBtn.classList.add('btn-' + cor)
            }

            li.appendChild(a)
            this.tipo.appendChild(li)
          })
        },

        isInside(x,y,folga = 0){
          folga *= 60 * 1000
          return x.inicio.getTime() < (new Date(y.fim).getTime() + folga) && new Date(y.inicio).getTime() < (x.fim.getTime() - folga)
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        try{go('add')}catch(e){toast(e.message)}
      })
    </script>
  </body>
</html>
