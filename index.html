  <script>
    const skipLogin = false
    const start = 'eventos'
    let dev = false

    const EV = <?!= JSON.stringify(ev) ?>;
    const LC = <?!= JSON.stringify(lc) ?>;

    const CACHE = <?!= cache ?>;

    const TIPOS = <?!= JSON.stringify(tipos) ?>;

    let USERS = {}

    const shortcodeMap = {}

    fetch('https://unpkg.com/emojilib@4.0.2/dist/emoji-en-US.json')
      .then(r => r.json())
      .then(data => {
        Object.entries(data).forEach(([emoji, nomes]) => {
          nomes.forEach(nome => shortcodeMap[nome] = emoji)
        })
      })

    //
    // NAVEGAÇÃO
    //

    const content = document.getElementById('content')
    const cache = {}

    const sidebarLinks = document.querySelectorAll('.nav-link')

    const mainHeader = document.getElementById('page-header')

    window.addEventListener('hashchange', () => {go(location.hash.slice(1))})

    function go(page) {
      const tpl = document.getElementById(`view-${page}`)
      if (!tpl) return

      sidebarLinks.forEach(a => {
        a.classList.toggle('active', a.getAttribute('href') === `#${page}`)
      })

      const control = Control[capital(page)]

      mainHeader.innerHTML = control.header
      content.innerHTML = ''
      content.appendChild(tpl.content.cloneNode(true))

      control.init()
    }

    function refresh(page){
      document.body.style.pointerEvents = 'none'
      google.script.run.withSuccessHandler((url) => {window.location.href = url + `#${page}`}).getScriptUrl()
    }

    //
    // CONTROLE
    //

    let userData

    const toastMsg = document.getElementById("toast")
    let msg = new bootstrap.Toast(toastMsg, {autohide: true, delay: 3000})

    const textModal = document.getElementById('modal-txt')
    const modalEl = document.getElementById('modal')
    const modal = new bootstrap.Modal(modalEl)
    const confirmBtn = document.getElementById('confirm')
    const cancelBtn = document.getElementById('cancel')
    const modalAlertBtns = document.getElementById('modal-alert')
    const modalConfirmBtns = document.getElementById('modal-confirm') 


    function toast(text, cor = 'warning') {

      text = text.replace('Error: ', '')

      toastMsg.classList = `toast align-items-center border-0 border-start border-3 border-${cor} text-bg-light`
      toastMsg.querySelector('.toast-body').innerHTML = text
      msg = bootstrap.Toast.getOrCreateInstance(toastMsg, {autohide: true, delay: 3000})
      msg.show()
      google.script.run.saveError(userData, error)
    }

    function toastWait(text, errors = null){
      toastMsg.classList = `toast align-items-center border-0 text-bg-light`
      const body = toastMsg.querySelector('.toast-body')
      body.innerHTML = `
        <div class="d-flex align-items-center gap-2">
          <div class="spinner-border spinner-border-sm" role="status"></div>
          <span>${text}</span>
          <span class="badge text-bg-danger ms-2 ${errors ? '' : 'd-none'}">${errors} ${errors > 1 ? 'erros' : 'erro'}</span>
        </div>
      `
      msg = bootstrap.Toast.getOrCreateInstance(toastMsg, {autohide: false})
      msg.show()
    }

    function alert(text, onclose = null){
      modalAlertBtns.classList.remove('d-none')
      textModal.innerHTML = text
      modalEl.addEventListener('hidden.bs.modal', () => {
        modalAlertBtns.classList.add('d-none')
        if(onclose) onclose()
      }, {once: true})
      modal.show()
    }

    async function confirm(text){
      modalConfirmBtns.classList.remove('d-none')
      textModal.innerHTML = text
      return new Promise((resolve) => {
        confirmBtn.onclick = () => resolve(true)
        cancelBtn.onclick = () => resolve(false)

        modalEl.addEventListener('hidden.bs.modal', () => {
          modalConfirmBtns.classList.add('d-none')
          resolve(false)
        }, {once: true})
        modal.show()
      })
    }
    
    const Control = {

      lc: LC,
      ev: EV,

      getLocal(localId){
        const [idSetor, idQuadra] = String(localId).split('.')
        const setor = Control.lc.setores.find(s => s.id == idSetor)
        if(!idQuadra) return setor
        const quadra = setor.quadras.find(q => q.id == localId)
        return quadra
      },

      getEvento(eventoId){
        const evento = {...Control.ev.eventos.find(e => e.id == eventoId)}
        evento.datas = evento.datas.map(d => d = {inicio: new Date(d.inicio), fim: new Date(d.fim)})
        return evento
      },

      aninharLocais(listaLocais) {
        let setor = null
        const aninhada = new Map()

        listaLocais.forEach(l => {
          if (setor?.id != l.id.split('.')[0]) {
            setor = Control.getLocal(l.id.split('.')[0])
            aninhada.set(setor, [])
          }
          if (l.tipo == 'quadra') {
            aninhada.get(setor).push(l)
          }
        })

        return aninhada
      },
      
      Add: {

        header: '<i class="bi bi-pencil-fill text-primary bi-underline" style="border-bottom: 1.5px solid currentColor; line-height: 1; font-size: 1.4rem;"></i><h2>Criar Evento</h2>',

        init() {

          this.CACHE = CACHE
          this.locaisSel = []
          this.datasSel = []

          this.getDOM()
          this.bind()
          Control.Info.init(this.preview)
          this.renderListaLocais()
          this.renderCalendar()
          this.renderTipos()
          this.titulo.focus()
          Control.Info.renderFull()
          Control.Info.renderCriador(userData.nome)
        },

        getDOM() {
          this.titulo = document.getElementById('titulo')

          this.tipoBtn = document.getElementById('tipo-btn')
          this.tipo = document.getElementById('tipo')

          this.inicio = document.getElementById('inicio')
          this.reverseBtn = document.getElementById('rev-btn')
          this.fim = document.getElementById('fim')
          this.addBtn = document.getElementById('add-btn')
          this.datasSelecionadas = document.getElementById('datasSelecionadas')

          this.buscaLocais = document.getElementById('busca-locais')
          this.listaLocais = document.getElementById('lista-locais')
          this.locaisSelecionados = document.getElementById('locaisSelecionados')

          this.obs = new Quill('#obs', {
            theme: 'snow',
            placeholder: 'Observações...',
            modules: {
              toolbar: [
                ['bold', 'italic', 'underline'],
                [{ list: 'ordered' }, { list: 'bullet' }],
                ['link'],
                ['clean']
              ]
            }
          })

          this.preview = document.getElementById('preview')

          this.submit = document.getElementById('submit')
          this.submitBtn = document.getElementById('submit-btn')
        },

        bind(){
          this.titulo.oninput = () => Control.Info.renderTitulo(this.titulo.value)
          this.buscaLocais.oninput = () => this.renderListaLocais(this.buscaLocais.value)
          this.addBtn.onclick = () => this.selecionarData()
          this.reverseBtn.onclick = () => this.reverseDates()
          this.submitBtn.onclick = () => this.adicionar()
          let replacing = false

          this.obs.on('text-change', () => {
            if (!replacing){
              const text = this.obs.getText()
              const match = text.match(/:([a-z0-9_]+):/)
              if (match){
                const emoji = shortcodeMap[match[1]]
                if (emoji){
                  replacing = true
                  const index = text.indexOf(match[0])
                  this.obs.deleteText(index, match[0].length)
                  this.obs.insertText(index, emoji)
                  this.obs.setSelection(index + emoji.length)
                  replacing = false
                }
              }
            } 
            Control.Info.renderObs(this.obs.root.innerHTML)
          })
        },

        cache(eventCache){
          const {titulo, tipo, datas, locais, obs} = eventCache

          this.titulo.value = titulo || ''
          if(tipo) this.tipo.querySelector(`#${tipo}`).click()

          this.datasSel = datas || []
          this.locaisSel = locais?.map(l => Control.getLocal(l)).filter(Boolean) || []
          this.locaisSel.forEach(l => this.selecionarLocal(l))

          if(obs?.delta) this.obs.setContents(JSON.parse(obs.delta))
          else this.obs.setText(obs?.texto || '')

          Control.Info.renderFull(eventCache)

          const removeData = (i) => {
            this.datasSel.splice(i, 1)
            Control.Info.renderDatas(this.datasSel, removeData)
          }
          Control.Info.renderDatas(this.datasSel, removeData)

          const removeLocal = (id) => {
            this.apagarLocal(id)
            Control.Info.renderLocais(this.locaisSel, removeLocal)
          }
          Control.Info.renderLocais(this.locaisSel, removeLocal)

        },

        renderListaLocais(filtro = '') {
          this.listaLocais.innerHTML = ''
          const termo = filtro

          const setores = Control.lc.setores.filter(s => !s.disabled).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'))

          setores.forEach(setor => {
            if (!setor.nome.toLowerCase().includes(termo.toLowerCase()) &&
                !setor.quadras.some(q => !q.disabled && q.nome.toLowerCase().includes(termo.toLowerCase()))) return

            // setores
            const header = document.createElement('div')
            header.className = 'dropdown-item rounded fw-bold ps-2 sticky-top dropdown-header-sticky'
            header.textContent = setor.nome
            header.id = setor.id
            header.onclick = () => this.selecionarLocal(setor)
            this.listaLocais.appendChild(header)

            // quadras
            setor.quadras.filter(q => !q.disabled && q.nome.toLowerCase().includes(termo)).sort((a, b) => {
              const aNum = !isNaN(a.nome)
              const bNum = !isNaN(b.nome)
              if (aNum && bNum) return Number(a.nome) - Number(b.nome)
              if (aNum !== bNum) return bNum - aNum
              return a.nome.localeCompare(b.nome, 'pt-BR')
            })
            .forEach(q => {
              const item = document.createElement('div')
              item.className = 'dropdown-item rounded p-0 ps-3'
              item.id = q.id
              item.textContent = q.nome
              item.onclick = () => this.selecionarLocal(q)
              this.listaLocais.appendChild(item)
            })
          })
        },

        selecionarLocal(local) {
          this.listaLocais.querySelectorAll(`[id^="${local.id + '.'}"]`).forEach(l => l.classList.add('disabled'))
          this.listaLocais.querySelector(`[id="${local.id}"]`).classList.add('disabled')

          this.locaisSel = [local, ...this.locaisSel.filter(l => !l.id.startsWith(local.id + '.'))]
          const remove = (id) => {
            this.apagarLocal(id)
            Control.Info.renderLocais(this.locaisSel, remove)
          }
          Control.Info.renderLocais(this.locaisSel, remove)
        },

        apagarLocal(localId){
          this.listaLocais.querySelectorAll(`[id^="${localId + '.'}"]`).forEach(l => l.classList.remove('disabled'))
          this.listaLocais.querySelector(`[id="${localId}"]`).classList.remove('disabled')

          this.locaisSel = this.locaisSel.filter(l => !l.id.startsWith(localId))
        },

        renderTipos(){            
          this.tipoSelecionado = null            
          this.tipoBtn.textContent = 'Tipo'
          this.tipo.innerHTML = ''
          Object.entries(TIPOS).forEach(([nome,cor]) =>{
            const li = document.createElement('li')            
            li.classList.add('px-1')
            const a = document.createElement('li')            
            a.className = "dropdown-item rounded ps-2"
            a.textContent = nome
            a.id = nome            
            a.style.cssText = `--bs-dropdown-link-active-bg: var(--bs-${cor.button}); --bs-dropdown-link-active-color: white`            
            a.onclick = (e) => {            
              e.preventDefault()            
              Control.Info.renderTipo(a.textContent)
              this.preview.classList.forEach(cls => {
                if (cls.startsWith('border-')) this.preview.classList.remove(cls)
              })
              this.preview.classList.add('border-2', `border-${cor.button}`)
              this.tipoBtn.textContent = a.textContent
              this.tipoBtn.classList.forEach(cls => {
                if (cls.startsWith('btn-')) this.tipoBtn.classList.remove(cls)
              })
              this.tipoBtn.classList.add(`btn-${cor.button}`)
            }
            li.appendChild(a)            
            this.tipo.appendChild(li)            
          })
        },

        renderCalendar() {

          flatpickr("#calendario-inicio", {
            locale: flatpickr.l10ns.pt,
            inline: true,
            enableTime: true,
            time_24hr: true,
            dateFormat: "d/m \\à\\s H:i",
            onChange: (selectedDates, dateStr) => {
              this.inicio.textContent = dateStr
              this.inicio.color = 'black'
              this.inicio.dataset.date = selectedDates[0]
            }
          })

          flatpickr("#calendario-fim", {
            locale: flatpickr.l10ns.pt,
            inline: true,
            enableTime: true,
            time_24hr: true,
            dateFormat: "d/m \\à\\s H:i",
            onChange: (selectedDates, dateStr) => {
              this.fim.textContent = dateStr
              this.fim.color = 'black'
              this.fim.dataset.date = selectedDates[0]
            }
          })
        },

        selecionarData() {
          if(!this.inicio.dataset.date) return toast('Selecione uma data de início', 'warning')
          if(!this.fim.dataset.date) return toast('Selecione uma data de fim', 'warning')

  
          const date = {inicio: new Date(this.inicio.dataset.date), fim: new Date(this.fim.dataset.date)}
          if(new Date() > date.fim) return toast('Essa data já passou')
          const intervalo = date.fim - date.inicio

          if(date.inicio > date.fim) {
            [date.inicio, date.fim] = [date.fim, date.inicio]
            this.reverseDates()
          }
          
          if(Math.abs(intervalo) < 60 * 60 * 1000) return toast('Escolha um intervalo de pelo menos 1 hora', 'warning')

          const folga = 30

          if(this.datasSel.some(d => isInside(date, d))) return toast('Essa data já foi escolhida', 'warning')
          if(this.datasSel.some(d => isInside(date, d, folga))) return toast(`No mínimo ${folga} minutos de folga entre datas`, 'warning')

          this.datasSel.push(date)

          const remove = (i) => {
            this.datasSel.splice(i, 1)
            Control.Info.renderDatas(this.datasSel, remove)
          }

          Control.Info.renderDatas(this.datasSel, remove)
        },

        reverseDates(){
          const inicioClone = this.inicio.cloneNode(true)
          const fimClone = this.fim.cloneNode(true)

          this.inicio.replaceWith(fimClone)
          this.fim.replaceWith(inicioClone)

          this.inicio = fimClone
          this.fim = inicioClone

          if(this.inicio.textContent == 'Fim') this.inicio.textContent = 'Início'
          if(this.fim.textContent == 'Início') this.fim.textContent = 'Fim'

          const titulo = this.titulo.value
          if(!titulo || titulo.length <= 2) {
            toast('Escolha um título', 'warning')
            return
          }

          const tipo = this.tipoBtn.textContent
          if(tipo == 'Tipo') {
            toast('Escolha um tipo', 'warning')
            return
          }
          
          if(!this.datasSel.length){
            this.selecionarData()
            if(!this.datasSel.length) return
          }

          const datas = this.datasSel.map(d => ({
            inicio: new Date(d.inicio).toISOString(),
            fim: new Date(d.fim).toISOString()
          }))

          const locais = this.locaisSel
          if(!locais || locais.length == 0) return toast('Escolha ao menos um local', 'warning')

          const obs = {
            texto: this.obs.getText().trim(),
            html: this.obs.root.innerHTML,
            delta: JSON.stringify(this.obs.getContents())
          }

          const {nome, sobrenome, email} = userData

          return {titulo, tipo, datas, locais, obs, criador: {nome: nome + ' ' + sobrenome, email}}
        },

          google.script.run.withFailureHandler(err => {
            try{
              err = JSON.parse(err.message || err)
              //this.showError(err.locais)
              toast(err.message, 'danger')
            }
            catch(e){
              toast(err.message, 'danger')
            }
            enable(this.submitBtn)
          }).withSuccessHandler(() => {
            toast('Adicionado', 'success')
            refresh('add')
          }).addEvento(evento)

        init() {
          this.eventos = Control.ev.eventos.slice().sort((a, b) => a.titulo.localeCompare(b.titulo, 'pt-BR'))
          .map(e => ({

              fim: new Date(d.fim)
            }))
          }))
          this.getDOM()
          this.bind()
          this.filtrar()
          this.renderCalendar()
        },

        renderLista(arr = this.eventos) {
          this.lista.innerHTML = ''

          if (!arr.length) {
            this.lista.innerHTML = `<option class="p-3" disabled>Nenhum evento encontrado</option>`
            this.renderConfig()
            return
          }

          arr.forEach(e => {
            const agora = new Date()
            const hoje = new Date()
            hoje.setHours(0, 0, 0, 0)
            const emAndamento = e.datas.some(d => isInside(d, {inicio: agora, fim: agora}))
            const finalizado = !e.datas.some(d => d.fim >= hoje)
            const ev = document.createElement('div')
            ev.classList = `p-1 px-3 border-bottom`
            ev.key = e.id
            ev.onclick = () => {
              if(this.selected) {
                const classList = [...this.selected.classList]
                this.selected.classList.remove(classList.find(c => c.startsWith('bg-')), 'text-white')
              }
              ev.classList.add(`bg-${TIPOS[e.tipo]?.button || 'secondary'}`, 'text-white')
              this.selected = ev
              this.renderConfig(e)
            }
            ev.style.cursor = 'pointer'

            ev.innerHTML = `
              <div class="fw-semibold">${e.titulo}</div>
              <div class="d-flex">
                <small class="opacity-75">${e.tipo} · ${e.datas?.length} data${e.datas?.length != 1 ? 's' : ''}</small>
                <small class="opacity-75 ms-auto fst-italic fw-semibold">${emAndamento ? 'Em andamento' : finalizado ? 'Finalizado' : ''}</small>
              </div>
            `

            this.lista.appendChild(ev)
          })

          this.lista.selectedIndex = 0
          this.renderConfig()

        renderConfig(ev = null) {

          const email = userData.email
          const nome = email.split('@')[0].split('.').map(p => capital(p)).join(' ')
          const admin = (ev && (ev.criador?.email == email || ev.criador === email || ev.criador == nome || userData.admin))

          toggle([this.editBtn, this.delBtn], admin)
          if(!ev) {
            this.config.innerHTML = '<option disabled>Nenhum evento selecionado</option>'
          }
          else {
            this.config.innerHTML = ''
            Control.Info.init(this.config)
            Control.Info.renderFull(ev)
          }

        filtrar() {
          const termo = this.busca.value.toLowerCase()
          const filtrados = this.eventos.filter(e => {

            const agora = new Date()
            const hoje = new Date()
            hoje.setHours(0,0,0,0)

            const periodo = this.datas?.inicio ? e.datas.some(d => isInside(d, this.datas)) : true

            const pesquisa = e.titulo.toLowerCase().includes(termo) || String(e.id).includes(termo)
            const email = userData.email
            const nome = email.split('@')[0].split('.').map(p => capital(p)).join(' ')

            const meusEventos = this.criados.checked ? (e.criador?.email == email || e.criador === email || e.criador == nome) : true

            const acontecendo = e.datas.some(d => isInside(d, {inicio: agora, fim: agora}))
            const finalizado = !e.datas.some(d => d.fim >= hoje)
            const show = (this.emAndamento.checked && acontecendo) || (this.finalizados.checked && finalizado) || (this.futuros.checked && !acontecendo && !finalizado)

            return pesquisa && meusEventos && periodo && show
          })
          this.renderLista(filtrados)
        },

            dateFormat: "d/m",

              .withSuccessHandler(() =>{
                toast('Apagado', 'success')
                refresh('eventos')
              })

      Locais:{

        },

        bind(){
          this.busca.oninput = () => this.renderSetores()
          this.listaSetores.onchange = () => this.renderQuadras()
          this.listaSetores.addEventListener("keydown", e => {
            switch (e.key) {
              case 'ArrowRight':
                this.listaQuadras.focus()
                break;

              case 'a':
                this.addBtn.click()
                break;

              case 'r':
                this.editBtn.click()
                break;
              
              case 'delete':
              case 'backspace':
                this.delBtn.click()
                break;
            }
          })
          
          this.listaQuadras.addEventListener("keydown", e => {
            switch (e.key) {
              case 'ArrowLeft':
                this.listaQuadras.focus()
                break;

              case 'a':
                this.addBtn.click()
                break;

              case 'r':
                this.editBtn.click()
                break;
              
              case 'delete':
              case 'backspace':
                this.delBtn.click()
                break;
            }
          })

          this.listaSetores.addEventListener('focusin', () => {
            this.listaSetores.classList.add('focus')
            this.listaQuadras.classList.remove('focus')
          })

          this.listaQuadras.addEventListener('focusin', () => {
            this.listaQuadras.classList.add('focus')
            this.listaSetores.classList.remove('focus')
          })

          this.changeIpt.addEventListener('input', () => {toggle(this.confirm, this.changeIpt.value.trim().length)})
          this.changeIpt.addEventListener('keydown', e =>{if(e.key == 'Enter') this.confirm.click()})
          this.changeIpt.addEventListener('keydown', e =>{if(e.key == 'Escape') this.cancel.click()})
          this.addBtn.onclick = () => this.adicionar()

          this.delBtn.onclick = () => this.apagar()
        },

        filtrar(locais, termo) {
          return locais.filter(l => {
            const nome = l.nome.toLowerCase().includes(termo)
            const id = String(l.id).includes(termo)
            const nomeQuadra = l.quadras?.some(q => q.nome.toLowerCase().includes(termo))
            const idQuadra = l.quadras?.some(q => q.id.includes(termo))

            return nome || id || nomeQuadra || idQuadra
          })
        },

        renderSetores(){
          const setores = this.filtrar(Control.lc.setores.slice(), this.busca.value.toLowerCase()).filter(s => !s.disabled).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'))
          this.listaSetores.innerHTML = ''

          if (!setores.length) {
            this.listaSetores.innerHTML = `<option disabled>Nenhum setor</option>`
            return
          }

          setores.forEach(s => {
            const opt = document.createElement('option')
            opt.value = s.id
            opt.textContent = s.nome
            this.listaSetores.appendChild(opt)
          })

          this.listaSetores.selectedIndex = 0
          this.renderQuadras()
        },

        renderQuadras(){
          const setor = Control.lc.setores.find(s => s.id === this.listaSetores.value && !s.disabled)
          if (!setor) return
          const quadras = this.filtrar(setor.quadras, this.busca2.value.toLowerCase()).filter(q => !q.disabled).sort((a, b) => {
            const aNum = !isNaN(a.nome)
            const bNum = !isNaN(b.nome)
            if (aNum && bNum) return Number(a.nome) - Number(b.nome)
            if (aNum !== bNum) return bNum - aNum
            const aLetra = a.nome.length === 1
            const bLetra = b.nome.length === 1
            if (aLetra !== bLetra) return bLetra - aLetra
            if (aLetra && bLetra) return a.nome.localeCompare(b.nome, 'pt-BR')
            return a.nome.localeCompare(b.nome, 'pt-BR')
          })
          this.listaQuadras.innerHTML = ''

          if (!quadras || !quadras.length){
            this.listaQuadras.innerHTML = `<option disabled>Nenhuma quadra</option>`
            return
          }

          quadras.forEach(s => {
            const opt = document.createElement('option')
            opt.value = s.id
            opt.textContent = s.nome
            this.listaQuadras.appendChild(opt)
          })

          this.listaQuadras.selectedIndex = 0
        },

        adicionar(){
          const isSetor = this.listaSetores.classList.contains('focus')

          this.control1.classList.replace('d-flex', 'd-none')
          this.control2.classList.replace('d-none', 'd-flex')

          disable(this.buttons)

          this.changeIpt.focus()
          this.changeIpt.placeholder = isSetor ? "Novo setor" : "Nova quadra"

          const setorId = isSetor ? null : this.listaSetores.value

          this.cancel.onclick = () => this.back()

          this.confirm.textContent = 'Adicionar'
          this.confirm.onclick = () => {
            const nome = (dev ? ['Teste'] : '') + this.changeIpt.value;
            disable([this.confirm, this.cancel, this.changeIpt])
            toastWait('Adicionando...')
            google.script.run
              .withFailureHandler(err => {
                toast(err.message, 'danger')
                this.back()
              }).withSuccessHandler(() => {
                toast('Adicionado', 'success')
                refresh('locais')
              }).criarLocal(nome, setorId)
          }
        },

        renomear(){
          const isSetor = this.listaSetores.classList.contains('focus')

          this.control1.classList.replace('d-flex', 'd-none')
          this.control2.classList.replace('d-none', 'd-flex')

          disable(this.buttons)

          const select = isSetor ? this.listaSetores : this.listaQuadras

          const id = select.value
          const nome = select.selectedOptions[0].textContent

          this.changeIpt.focus()
          this.changeIpt.value = nome
          this.changeIpt.placeholder = nome

          disable([this.listaSetores, this.listaQuadras])

          const func = () => {toggle(this.confirm, this.changeIpt.value && this.changeIpt.value != nome)}
          this.changeIpt.addEventListener('input', func)
          disable(this.confirm)

          this.cancel.onclick = () => {
            this.back()
            this.changeIpt.removeEventListener('input', func)
          }
          this.confirm.textContent = 'Salvar'
          this.confirm.onclick = () => {
            const novo = this.changeIpt.value
            disable([this.confirm, this.cancel, this.changeIpt])
            toastWait('Renomeando...')
            google.script.run
              .withFailureHandler(err => {
                toast(err.message, 'danger')
                this.changeIpt.removeEventListener('input', func)
                this.back()
              }).withSuccessHandler(() => {
                toast('Renomeado', 'success')
                refresh('locais')
              }).renomearLocal(id, novo)
          }
        },

        async apagar(){
          const isSetor = this.listaSetores.classList.contains('focus')

          const options = [...(isSetor ? this.listaSetores.selectedOptions : this.listaQuadras.selectedOptions)]
          const setorId = isSetor ? this.listaSetores.value : null
          
          const response = await confirm(`
          Deseja apagar ${(isSetor ? 'esses setores?' : 'essas quadras?')}
          <div class="mt-2 p-1 px-2 border rounded border-secondary text-start" style="width: fit-content">${options.map(o => o.text).join('<br>')}</span>
          `)


          if(response){
            const errors = []

            await Promise.all(options.map(o => new Promise((resolve) => {
              toastWait(`Apagando ${o.text}...`, errors.length)
              google.script.run
                .withFailureHandler(err => {
                  errors.push(o.text + ': ' + err.message)
                  resolve()
                })
                .withSuccessHandler(() => resolve())
                .apagarLocal(o.value, dev)
            })))

            if(errors.length) alert('Os seguintes locais não foram apagados:\n' + errors.join('\n'), () => refresh('locais'))
            else{
              toast('Locais apagados', 'success')
              refresh('locais')
            }
          }
        },

        back(){
          enable([this.confirm, this.cancel, this.changeIpt, this.listaSetores, this.listaQuadras])
          this.control1.classList.replace('d-none', 'd-flex')
          this.control2.classList.replace('d-flex', 'd-none')
        },

          this.backBtn.onclick = () => this.back()
          this.regBtn.onclick = () => this.submitRegister();

          [this.user, this.pass].forEach(input => {
            input.addEventListener('keydown', e => {
              if (e.key === 'Enter') this.login()
            })
          })
        },

        setErr(msg) {
          this.err.textContent = msg
          this.err.classList.toggle('d-none', !msg)
        },

        login() {
          const user = this.user.value.trim() + '@praiaclube.org.br'
          const pass = this.pass.value

          if(!user || !pass) return this.setErr('Preencha todos os campos')
          if(pass.length < 6) return this.setErr('Escolha uma senha maior')
          this.setErr('')

          disable(this.loginBtn)
          toastWait('Entrando...')

          google.script.run
            .withFailureHandler(err => {
              toast(err.message, 'danger')
              enable(this.loginBtn)
            })
            .withSuccessHandler(data => {
              this.modal.hide()
              document.body.classList.remove('view-login')
              msg.hide()
              userData = {senha: '*'.repeat(pass.length), ...data}
              localStorage.setItem('userData', JSON.stringify(userData))
              go(location.hash.slice(1) || start)
              if(userData?.admin){
                [...document.querySelectorAll(".restricted")].forEach(v => v.hidden = false)
                USERS = <?!= JSON.stringify(users) ?>;
              }
          }).login(user, pass)
        },

        register() {
          this.painelLogin.classList.add('d-none')
          this.painelRegister.classList.remove('d-none')
          this.regEmail.value = this.user.value
        },

        back() {
          this.painelRegister.classList.add('d-none')
          this.painelLogin.classList.remove('d-none')
          this.user.value = this.regEmail.value
        },

        submitRegister() {
          const nome = this.regNome.value.trim()
          const sobrenome = this.regSobrenome.value.trim()
          const setor = this.regSetor.value.trim()
          const email = this.regEmail.value.trim() + '@praiaclube.org.br'
          const senha = this.regPass.value

          if (!nome || !setor || !email || !senha)
            return this.regErr.textContent = 'Preencha todos os campos', this.regErr.classList.remove('d-none')

          this.regErr.classList.add('d-none')
          disable(this.regBtn)
          toastWait('Registrando...')

          google.script.run
            .withFailureHandler(err => {
              toast(err.message, 'danger')
              this.regErr.classList.remove('d-none')
              enable(this.regBtn)
            })
            .withSuccessHandler(() => {
              this.back()
              toast('Conta criada!', 'success')
          }).cadastrar({nome, sobrenome, setor, email, senha})
        }
      },

      Info: {

        span(id){
          return `<span id=${id} class="text-danger" style="cursor:pointer">x</span>`
        },

        init(dom){
          this.setTpl(dom)
          this.getDOM()
        },

        setTpl(dom){
          const tpl = document.getElementById('view-info')
          dom.appendChild(tpl.content.cloneNode(true))
        },

        getDOM(dom){
          this.container    = document.getElementById('info-container')
          this.titulo       = document.getElementById('info-titulo')
          this.tipo         = document.getElementById('info-tipo')
          this.datasLabel   = document.getElementById('datas-label')
          this.datas        = document.getElementById('info-datas')
          this.locaisLabel  = document.getElementById('locais-label')
          this.locais       = document.getElementById('info-locais')
          this.criadorLabel = document.getElementById('criador-label')
          this.criador      = document.getElementById('info-criador')
          this.obsLabel     = document.getElementById('obs-label')
          this.obs          = document.getElementById('info-obs')
        },

        renderTitulo(titulo){
          this.titulo.textContent = titulo || 'Título'
          this.titulo.classList.toggle('fst-italic', !titulo)
          this.titulo.classList.toggle('text-secondary', !titulo)
        },

        renderTipo(tipo){
          this.tipo.className = tipo
            ? 'badge mb-3 text-bg-' + (TIPOS[tipo]?.button || 'secondary')
            : 'badge mb-3 fst-italic text-bg-secondary'
          this.tipo.textContent = tipo || 'Tipo'
        },

        renderDatas(datas, remove = null){
          const existe = datas?.length
          this.datasLabel.classList.toggle("fst-italic", !existe)
          this.datasLabel.classList.toggle("text-secondary", !existe)
          this.datas.innerHTML = existe ? datas.map((d, i) => {
            let {inicio, fim} = d
            const longo = fim - inicio >= 24 * 60 * 60 * 1000
            return `
            <div class="d-flex gap-1 align-items-baseline">
              <div class="small">• ${inicio.datahora()} até ${longo ? fim.datahora() : fim.hora()}</div>
              ${remove ? this.span(i) : ''}
            </div>`
          }).join('')
          : 
          `<div class="small fst-italic text-secondary">• Data 1</div>
          <div class="small fst-italic text-secondary">• Data 2</div>`
          if(remove && existe) this.datas.querySelectorAll('span').forEach(d => {
            d.style.cursor = 'pointer'
            d.onclick = () => remove(d.id)
          })
        },

        renderLocais(locais, remove = null){
          const existe = locais?.length
          this.locaisLabel.classList.toggle("fst-italic", !existe)
          this.locaisLabel.classList.toggle("text-secondary", !existe)
          const listaLocais = locais ? Control.aninharLocais(locais.sort((a,b) => Number(a.id.split('.')[0]) - Number(b.id.split('.')[0]))) : null

          this.locais.innerHTML = existe ? [...listaLocais.entries()].map(([k, v]) => {
            return `
            <div class="d-flex gap-1 align-items-baseline">
              <div class="small fw-semibold">• ${k.nome + (v.length ? ':' :  ' (Setor inteiro)')}</div>
              ${remove ? this.span(k.id) : ''}
            </div>`
            + v.map(value => `
              <div class="d-flex gap-1">
                <div class="ms-2 small">- ${value.nome.length <= 2 ? 'Quadra' : ''} ${value.nome}</div>
                ${remove ? this.span(value.id) : ''}
              </div>`
            ).join('')
          }).join('')
          : 
          `<div class="small fst-italic text-secondary fw-semibold">• Setor 1</div>
          <div class="ms-2 fst-italic text-secondary small">- Quadra 1</div>
          <div class="ms-2 fst-italic text-secondary small">- Quadra 2</div>
          <div class="small fst-italic text-secondary fw-semibold">• Setor 2 (Setor inteiro)</div>`
          
          if(remove && existe) this.locais.querySelectorAll('span').forEach(l => {
            l.style.cursor = 'pointer'
            l.onclick = () => remove(l.id)
          })
        },

        renderCriador(criador){
          const desconhecido = !(criador?.nome || criador)

          this.criador.textContent = criador?.nome || criador || 'Desconhecido'
          this.criador.classList.toggle("fst-italic", desconhecido)
          this.criador.classList.toggle("text-danger", desconhecido)
        },

        renderObs(obs){
          const vazio = !obs || obs.replace(/<[^>]*>/g, '').trim() === ''
          this.obsLabel.classList.toggle('fst-italic', vazio)
          this.obsLabel.classList.toggle('text-secondary', vazio)
          this.obs.innerHTML = vazio ? '' : `<div class="border rounded p-2">${obs.trim()}</div>`
          this.container.scrollTop = this.container.scrollHeight
        },

        renderFull(evento = {}){
          const {titulo, tipo, criador, datas, locais, obs} = evento
          this.renderTitulo(titulo)
          this.renderTipo(tipo)
          this.renderCriador(criador)
          this.renderDatas(datas)
          this.renderLocais(locais?.map(l => Control.getLocal(l)))
          this.renderObs(obs?.html || obs?.texto || null)
          this.container.scrollTop = 0
        },
      },

      Users: {

        header: '<i class="bi bi-person-badge-fill text-warning" style="font-size: 1.6rem"></i><h2 style="left: -0.2rem">Lista de Usuários</h2>',

        init(){
          this.getDOM()
          this.renderUsers()
        },

        getDOM(){
          this.busca = document.getElementById("user-busca")
          this.setoresBtn = document.getElementById("btn-setores")
          this.setores = document.getElementById("user-setores")
          this.users = document.getElementById("users")
          this.info = document.getElementById("user-info")
          this.selected = null
        },

        bind(){
          this.busca.onchange = () => this.renderUsers() 
        },

        renderUsers(obj = USERS){
          console.log(obj)
          this.users.innerHTML = ''
          Object.entries(obj).forEach(([id, user]) => {
            const {nome, sobrenome, setor, admin} = user
            const us = document.createElement('div')
            us.className = `d-flex align-items-center p-1 px-3 border-bottom`
            us.id = id
            us.style.cursor = 'pointer'
            us.innerHTML = `
            <div class="d-flex flex-column">
              <div class="fw-semibold">${nome} ${sobrenome}</div>
              <small class="opacity-75">${setor}</small>
            </div>
            <button class="ms-auto btn btn-sm btn-${admin ? 'dark' : 'light'}" disabled>Administrador</button>
            `
            const btn = us.querySelector('button')
            btn.onclick = () => {
              btn.classList.toggle('btn-light')
              btn.classList.toggle('btn-dark')
            }
            us.onclick = () => {
              if(this.selected) {
                const classList = [...this.selected.classList]
                this.selected.classList.remove(classList.find(c => c.startsWith('bg-')), 'text-white')
              }
              us.classList.add('bg-primary', 'text-white')
              this.selected = us
              this.renderInfo(user)
            }
            this.users.appendChild(us)
          })
        },

        renderInfo(user){
          const {nome, sobrenome, setor, email, admin} = user

          this.info.innerHTML = `
            <div class="d-flex align-items-baseline">
              <i class="bi bi-person"></i>
              <p class="fw-semibold mb-0">Nome:</span>
              <p class="small ms-1 mb-0">${nome}</span>
              <p class="fw-semibold mb-0 ms-3">Sobrenome:</span>
              <p class="small ms-1 mb-0">${sobrenome}</span>
            </div>
            <div class="d-flex align-items-baseline">
              <i class="bi bi-pin-map"></i>
              <p class="fw-semibold mb-0">Setor:</span>
              <p class="small ms-1 mb-0">${setor}</span>
            </div>
            <div class="d-flex align-items-baseline">
              <i class="bi bi-at"></i>
              <p class="fw-semibold mb-0">Email:</span>
              <p class="small ms-1 mb-0">${email}</span>
            </div>
            <div class="d-flex align-items-baseline">
              <i class="bi bi-gear"></i>
              <p class="fw-semibold mb-0">Administrador:</span>
              <p class="small ms-1 mb-0">${admin ? 'Sim' : 'Não'}</span>
            </div>
          `
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if(!skipLogin){ 
        const loginTpl = document.getElementById('view-login')
        document.body.appendChild(loginTpl.content.cloneNode(true))
        Control.Login.init()
      }
      else{
        userData = {nome: "Dev", sobrenome: "da Silva", email: "aurea.ego@praiaclube.org.br", senha: "coxinha123", admin: true, setor: "Deus supremo"}
        go(start)
        dev = true
      }
    })

  </script>
